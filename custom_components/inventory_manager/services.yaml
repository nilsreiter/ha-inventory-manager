store:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          filter:
            - integration: inventory_manager
    amount:
      required: true
      example: 42
      selector:
        number:
          min: 0
          step: any
          mode: box
consume:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          filter:
            - integration: inventory_manager
    amount:
      example: 42
      selector:
        number:
          min: 0
          step: any
          mode: box
    predefined-amount:
      example: "morning"
      selector:
        select:
          translation_key: time
          options:
            - "morning"
            - "noon"
            - "evening"
            - "night"
            - "week"
            - "month"